[project]
name = "agent-workbench"
version = "0.1.0"
description = "A lightweight local AI workbench with a compact chat path and explicit core services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "alembic>=1.13,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "httpx-sse>=0.4,<0.5",
    "jsonschema>=4.23,<5",
    "uv==0.11.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "openapi-spec-validator>=0.7.2,<0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
