id: image_generation
name: Image Generation Capability
description: Internal project-native image generation service for trusted Agents.

methods:
  - id: status
    description: Return internal image generation profile and runtime status.
    input_schema: {}
    output:
      part_type: json

  - id: list_model_profiles
    description: List internal image generation model profiles.
    input_schema:
      enabled_only:
        type: boolean
        required: false
    output:
      part_type: json

  - id: validate_txt2img
    description: Validate a txt2img request against the selected Image Model Profile.
    input_schema:
      profile_id_or_alias:
        type: string
        required: true
      positive_prompt:
        type: string
        required: true
      negative_prompt:
        type: string
        required: false
      width:
        type: integer
        required: false
      height:
        type: integer
        required: false
      steps:
        type: integer
        required: false
      cfg:
        type: float
        required: false
      sampler:
        type: string
        required: false
      scheduler:
        type: string
        required: false
      seed:
        type: integer
        required: false
      batch_size:
        type: integer
        required: false
      loras:
        type: json
        required: false
    output:
      part_type: json

  - id: txt2img
    description: Generate image payloads for a validated txt2img request using the internal runtime.
    input_schema:
      profile_id_or_alias:
        type: string
        required: true
      positive_prompt:
        type: string
        required: true
      negative_prompt:
        type: string
        required: false
      width:
        type: integer
        required: false
      height:
        type: integer
        required: false
      steps:
        type: integer
        required: false
      cfg:
        type: float
        required: false
      sampler:
        type: string
        required: false
      scheduler:
        type: string
        required: false
      seed:
        type: integer
        required: false
      batch_size:
        type: integer
        required: false
      loras:
        type: json
        required: false
    output:
      part_type: json

  - id: queue_status
    description: Return compact internal image generation queue and cache status.
    input_schema: {}
    output:
      part_type: json

  - id: cancel
    description: Request cancellation for an internal image generation request.
    input_schema:
      request_id:
        type: string
        required: false
      run_id:
        type: string
        required: false
    output:
      part_type: json

  - id: unload
    description: Best-effort release of internal image generation runtime cache.
    input_schema:
      profile_id_or_alias:
        type: string
        required: false
    output:
      part_type: json

commands: []
